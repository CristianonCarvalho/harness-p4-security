# SAST do código Python do red team: reprova o push ou o PR com achado de severidade média ou alta (bandit -ll).
# Achados de severidade baixa são de uso previsto (o harness chama `claude` e `uv` por subprocess, de propósito)
# e não reprovam; eles aparecem no log com `uv run bandit -r redteam`.
name: sast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ações fixadas pelo hash do commit (o rótulo pode ser movido pelo dono; o hash, não).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked
      - run: uv run bandit -r redteam -ll

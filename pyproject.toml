[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redteam"
version = "0.1.0"
description = "Red team do MCP server do P2 (P4, spec B)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest",
    "pytest-timeout",
]

[tool.hatch.build.targets.wheel]
packages = ["redteam"]

[tool.pytest.ini_options]
testpaths = ["redteam/tests"]
timeout = 30
pythonpath = ["."]
